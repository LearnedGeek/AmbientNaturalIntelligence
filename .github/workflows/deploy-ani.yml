name: Deploy ANI to Server

# Auto-deploy pipeline for the ANI runtime. Triggers on every push to main.
# Runs on a self-hosted runner installed on the dedicated ANI server
# (192.168.1.100) so deploys happen in-place without SSH/WinRM round-trips.
#
# Contract:
#   - Build fails → deploy blocked
#   - Any test fails → deploy blocked
#   - Service stop/start failure → workflow fails; admin investigates
#   - No Blue/Green or staging -- research velocity over operational safety
#     (acceptable because research IS the iteration; rollback = revert commit,
#     push again, workflow redeploys)
#
# Prerequisites on the server (one-time):
#   - .NET 8 SDK installed
#   - GitHub Actions self-hosted runner registered with labels [self-hosted, windows, ani-server]
#   - Runner service running under an account with sc.exe permissions on AniRuntime
#   - ANI Windows Service installed (see SERVER-SETUP.md)
#   - appsettings.Development.json and SQLite DBs present in expected locations
#     (these are NOT in git; placed manually during initial cutover)
#
# Cross-repo dependency (May 3, 2026):
#   - The csproj files reference `..\..\..\learnedgeek-libs\LearnedGeek.ML\...`
#     (sibling-repo layout). The workflow checks out both repos under
#     $GITHUB_WORKSPACE so the relative path resolves. Requires the
#     LEARNEDGEEK_LIBS_TOKEN repo secret (fine-grained PAT with read on
#     LearnedGeek/learnedgeek-libs).

on:
  push:
    branches: [ main ]
    # Don't trigger a full deploy on Serge-review-only edits (rules
    # file + AI review workflow itself). Neither reaches the runtime;
    # skipping saves a build+publish cycle.
    paths-ignore:
      - '.ai/**'
      - '.github/workflows/ai-review.yml'
  workflow_dispatch:     # manual trigger from the Actions UI

concurrency:
  group: deploy-ani
  cancel-in-progress: false    # never cancel a deploy mid-flight

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  SERVICE_NAME: AniRuntime
  # Absolute path matches the service binPath so `dotnet publish` writes
  # straight into the install folder. Runner's _work dir stays for build
  # scratch only; no copy step needed. Runtime-created subdirs (logs/,
  # data/) and untracked files (appsettings.Development.json) survive
  # publish because publish is additive, not a mirror.
  PUBLISH_DIR: C:\dev\repos\AmbientNaturalIntelligence\publish\AniRuntime
  # Stable on-server location for the Eval CLI so SSH sessions can invoke
  # it directly (e.g. anichat-sweep-prod.ps1). Parallel to PUBLISH_DIR;
  # NOT under it, because publish is additive and we don't want the eval
  # binary to ship alongside the service install.
  EVAL_PUBLISH_DIR: C:\dev\repos\AmbientNaturalIntelligence\publish\Eval

jobs:
  deploy:
    name: Build, Test, Deploy
    runs-on: [self-hosted, windows, ani-server]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: AmbientNaturalIntelligence

    steps:
      # Sibling-repo layout: AmbientNaturalIntelligence/ and learnedgeek-libs/
      # both under $GITHUB_WORKSPACE so the cross-repo <ProjectReference>
      # paths in csproj files resolve correctly.
      - name: Checkout AmbientNaturalIntelligence
        uses: actions/checkout@v4
        with:
          path: AmbientNaturalIntelligence

      - name: Checkout learnedgeek-libs (private sibling repo)
        uses: actions/checkout@v4
        with:
          repository: LearnedGeek/learnedgeek-libs
          path: learnedgeek-libs
          token: ${{ secrets.LEARNEDGEEK_LIBS_TOKEN }}

      - name: Verify .NET SDK
        # Self-hosted runners use whatever is pre-installed on the machine.
        # actions/setup-dotnet tries to install into C:\Program Files\dotnet
        # which requires admin, and the runner service runs as NETWORK SERVICE
        # by default. .NET 8 SDK is installed on the server per the migration
        # runbook Phase 1.2 -- just verify it's accessible.
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          dotnet --list-sdks
          $has8 = dotnet --list-sdks | Select-String '^8\.'
          if (-not $has8) {
            Write-Error ".NET 8 SDK not found on this runner. Install via 'winget install Microsoft.DotNet.SDK.8' as Administrator."
            exit 1
          }

      - name: Restore
        run: dotnet restore tests/AniRuntime.Tests/AniRuntime.Tests.csproj

      - name: Build (test project)
        run: dotnet build tests/AniRuntime.Tests/AniRuntime.Tests.csproj --no-restore --configuration Release

      # Regression-class harness (2026-05-14): SPEC tests for currently-open
      # failure classes carry [Trait("Category", "RegressionOpen")] and are
      # excluded from the deploy gate. These are tracked failures (see
      # GitHub issues labeled `failure-class`); they do NOT block deploys
      # of unrelated work. Closed→open transitions remain real regressions
      # and stay in the gate. See docs/spec/ANI-Test-Harness-Plan.md.
      - name: Test (gate)
        run: >
          dotnet test
          tests/AniRuntime.Tests/AniRuntime.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category!=RegressionOpen"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: AmbientNaturalIntelligence/test-results/**
          retention-days: 14

      # AniRuntime.Eval is a CLI tool not referenced by the test project, so
      # the transitive build above skips it. Build it explicitly (early) so
      # the Phase A-E eval harness (Issue #79) is CI-gated. Publish moved
      # to AFTER the service deploy — see #104. A long-running detached
      # Eval process (backfills) holds DLL locks in EVAL_PUBLISH_DIR;
      # publishing before service-deploy meant a lock failure skipped every
      # subsequent step including Start service, silently no-op'ing deploys.
      # Order now: service deploy is priority-1, Eval CLI publish is
      # priority-2, and a lock failure on Eval publish still fails the
      # workflow loud without gating service updates.
      - name: Build Eval CLI
        run: dotnet build tools/AniRuntime.Eval/AniRuntime.Eval.csproj --configuration Release

      # If we get here, tests passed AND the Eval CLI built. Safe to deploy.

      - name: Check service exists
        id: service-check
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $svc = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host "::warning::Service '$env:SERVICE_NAME' not installed on this runner. First-time deploy requires manual install -- see SERVER-SETUP.md."
            # Use Add-Content with UTF8 -- Out-File on PS 5.1 defaults to UTF-16,
            # which corrupts the GITHUB_OUTPUT file GitHub Actions expects as UTF-8.
            Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=false" -Encoding UTF8
          } else {
            Write-Host "Service '$env:SERVICE_NAME' is currently: $($svc.Status)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=true" -Encoding UTF8
            Add-Content -Path $env:GITHUB_OUTPUT -Value "prior_status=$($svc.Status)" -Encoding UTF8
          }

      - name: Stop service
        if: steps.service-check.outputs.installed == 'true'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Stopping $env:SERVICE_NAME..."
          $svc = Get-Service -Name $env:SERVICE_NAME -ErrorAction Stop
          Write-Host "  initial status: $($svc.Status)"
          if ($svc.Status -eq 'Stopped') {
            Write-Host "  service already stopped - proceeding to publish."
            exit 0
          }
          # sc.exe returns 1062 (ERROR_SERVICE_NOT_ACTIVE) when the service
          # is already stopped, which PowerShell treats as a step failure.
          # The status check above handles the common case; pipe sc.exe's
          # output away so a transient race doesn't trip the step.
          sc.exe stop $env:SERVICE_NAME | Out-Null
          # Wait up to 30s for clean stop; don't proceed if still running
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 2
            $svc = Get-Service -Name $env:SERVICE_NAME
            Write-Host "  status: $($svc.Status)"
          } while ($svc.Status -ne 'Stopped' -and (Get-Date) -lt $deadline)
          if ($svc.Status -ne 'Stopped') {
            Write-Error "Service did not stop within 30s. Aborting deploy."
            exit 1
          }

      - name: Publish
        run: dotnet publish src/AniRuntime.Service/AniRuntime.Service.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Start service
        if: steps.service-check.outputs.installed == 'true'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Starting $env:SERVICE_NAME..."
          sc.exe start $env:SERVICE_NAME
          # Wait up to 30s for running state
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 2
            $svc = Get-Service -Name $env:SERVICE_NAME
            Write-Host "  status: $($svc.Status)"
          } while ($svc.Status -ne 'Running' -and (Get-Date) -lt $deadline)
          if ($svc.Status -ne 'Running') {
            Write-Error "Service did not reach Running within 30s. Check server logs."
            exit 1
          }

      - name: Health check
        if: steps.service-check.outputs.installed == 'true'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          # Give the service a moment to bind the port
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:5100/health" -Method Get -TimeoutSec 10
            Write-Host "Health check OK"
            Write-Host ($response | ConvertTo-Json -Depth 3)
          } catch {
            Write-Warning "Health endpoint not responding: $_"
            Write-Warning "Deploy completed but service health is unconfirmed -- investigate server logs."
            # Non-fatal: service may still be warming up. Don't fail the deploy on this alone.
          }

      # Publish Eval CLI runs AFTER the service is deployed and healthy (#104).
      # File-lock failures here (from long-running detached Eval processes
      # holding DLLs in EVAL_PUBLISH_DIR) no longer skip service deploy —
      # they fail loud on their own step, service is already live.
      - name: Publish Eval CLI
        if: always()
        run: dotnet publish tools/AniRuntime.Eval/AniRuntime.Eval.csproj -c Release -o ${{ env.EVAL_PUBLISH_DIR }} --no-build

      - name: Upload Eval CLI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-cli-${{ github.sha }}
          path: ${{ env.EVAL_PUBLISH_DIR }}/**
          retention-days: 14

      - name: Deploy summary
        if: always()
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $svc = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          $status = if ($svc) { $svc.Status } else { "Not Installed" }
          $summary = @"
          ### ANI Deploy Summary

          - **Commit:** ${{ github.sha }}
          - **Service status:** $status
          - **Publish dir:** $env:PUBLISH_DIR
          - **Triggered by:** ${{ github.actor }}

          Logs on the server: ``publish/AniRuntime/logs/ani-debug-$(Get-Date -Format 'yyyyMMdd').log``
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding UTF8
