name: CI

on:
  push:
    branches: [ main, 'claude/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & Test
    # 2026-08-06 — moved off GitHub-hosted ubuntu-latest to the self-hosted
    # ani-server runner. Rationale: GitHub-hosted queue depth wedged us for
    # 20+ min after ani-server reboot on 2026-08-06 because reruns still had
    # to compete for the shared public runner pool. Self-hosted eliminates
    # that queue entirely (single-tenant runner, always available whenever
    # the ani-server host is up).
    #
    # Prerequisites present on ani-server as of the move date:
    #   - .NET 8 SDK at C:\Program Files\dotnet\sdk (8.0.422, 8.0.423)
    #   - Git for Windows bash at C:\Program Files\Git\bin\bash.exe
    #     (GitHub Actions defaults `shell: bash` to Git Bash on Windows)
    #   - actions/setup-java@v4 installs Zulu JDK 17 into the runner's tool
    #     cache on first run; cached across subsequent runs.
    # SDK version pinned via `global.json` at repo root (rollForward:
    # latestFeature). Bumping the pin is intentional + visible in git blame.
    runs-on: [self-hosted, windows, ani-server]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: AmbientNaturalIntelligence
        # Pinning shell to the explicit Git Bash path — `shell: bash` on
        # Windows self-hosted with a SYSTEM-account runner picks
        # C:\WINDOWS\system32\bash.EXE (WSL bash) first per PATH order,
        # and WSL refuses to launch as SYSTEM
        # (Bash/WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED).
        #
        # Explicit path uses forward slashes + double quotes — the
        # backslash form triggers GitHub Actions' internal Path.Combine
        # with "Second path fragment must not be a drive or UNC name"
        # because the runner argument parser interprets `C:\` as a UNC
        # prefix. Forward slashes bypass that. The `{0}` is the standard
        # GitHub Actions placeholder for the script file the runner writes.
        shell: '"C:/Program Files/Git/bin/bash.exe" --noprofile --norc -e -o pipefail "{0}"'

    steps:
      # Sibling-repo layout so the cross-repo <ProjectReference> in csproj
      # files (`..\..\..\learnedgeek-libs\LearnedGeek.ML\...`) resolves.
      # The main repo is checked out under AmbientNaturalIntelligence/
      # and learnedgeek-libs/ sits next to it under $GITHUB_WORKSPACE.
      # Project files at depth 3 (src/X/X.csproj) walk three `..` to reach
      # the workspace root, then descend into learnedgeek-libs.
      #
      # fetch-depth: 0 — SonarCloud needs full git history for blame/PR
      # decoration. Without it, "new code" detection on PRs misattributes
      # lines.
      - name: Checkout AmbientNaturalIntelligence
        uses: actions/checkout@v4
        with:
          path: AmbientNaturalIntelligence
          fetch-depth: 0

      - name: Checkout learnedgeek-libs (private sibling repo)
        uses: actions/checkout@v4
        with:
          repository: LearnedGeek/learnedgeek-libs
          path: learnedgeek-libs
          token: ${{ secrets.LEARNEDGEEK_LIBS_TOKEN }}

      # 2026-08-06 — actions/setup-dotnet DELETED on the self-hosted move
      # per ~/.claude/CI-INFRA.md §1. setup-dotnet@v4 unconditionally
      # attempts to write a base LTS runtime to C:\Program Files\dotnet\,
      # which the runner user can't do. SDK pin lives in ./global.json
      # (rollForward: latestFeature); ani-server has 8.0.422 + 8.0.423
      # installed globally so the pin resolves. This verify step fails
      # loud if the runner is ever missing the pinned SDK — fix by
      # installing that version on the runner, NOT by reintroducing
      # setup-dotnet.
      - name: Verify pinned SDK is present
        run: |
          dotnet --version
          dotnet --list-sdks

      # SonarScanner for .NET is a Java tool; needs JDK 17+.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      # Begin SonarCloud analysis — must come BEFORE restore/build/test so
      # the scanner can instrument the build. The end-step (after tests)
      # uploads the results.
      #
      # Coverage report path: tests emit OpenCover XML via the runsettings
      # at tests/AniRuntime.Tests/coverlet.runsettings. The glob walks the
      # whole workspace because the dotnet test runner writes coverage
      # under TestResults/<guid>/coverage.opencover.xml.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"LearnedGeek_AmbientNaturalIntelligence" \
            /o:"learnedgeek" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**/*,**/Program.cs,**/Migrations/**/*,src/AniRuntime.MauiClient/**/*,src/AniRuntime.Dashboard/**/*"

      # Build and test via the test project — this transitively restores and builds
      # all src projects except AniRuntime.MauiClient (net10.0-android), which
      # requires the maui-android workload and Android SDK not available on ubuntu.
      # The .slnx includes MAUI for local development; CI targets test project only.
      - name: Restore
        run: dotnet restore tests/AniRuntime.Tests/AniRuntime.Tests.csproj

      - name: Build
        run: dotnet build tests/AniRuntime.Tests/AniRuntime.Tests.csproj --no-restore --configuration Release

      # AniRuntime.Eval is a CLI tool not referenced by the test project, so it
      # isn't pulled into the transitive build above. Build it explicitly so
      # CI catches breakage in the Phase A-E eval harness (Issue #79). Its
      # ProjectReferences (Service, Loops, etc.) resolve against the already-
      # restored package cache, so an explicit restore step isn't required.
      - name: Build Eval CLI
        run: dotnet build tools/AniRuntime.Eval/AniRuntime.Eval.csproj --configuration Release

      # Regression-class harness (2026-05-14): SPEC tests for currently-open
      # failure classes carry [Trait("Category", "RegressionOpen")]. These
      # are designed-to-fail markers that close when the production fix
      # ships (see ANI-Test-Harness-Plan in the ani-docs paired repo and
      # GitHub issues labeled `failure-class`). They are NOT regressions;
      # excluding them from CI keeps the gate honest about "did this
      # commit break something" vs "is there known unaddressed work."
      # H.4 (issue #27) will add a CLOSED-regression check: previously-
      # closed scenarios must stay closed (closed→open transition = real
      # regression).
      #
      # Coverage: --settings points at the runsettings that emits OpenCover
      # format (SonarCloud requirement for .NET). Default cobertura output
      # would be ignored by the scanner.
      - name: Test
        run: >
          dotnet test
          tests/AniRuntime.Tests/AniRuntime.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category!=RegressionOpen"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"
          --settings tests/AniRuntime.Tests/coverlet.runsettings

      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: AmbientNaturalIntelligence/test-results/**
          retention-days: 7

      # End SonarCloud analysis — uploads scan + coverage to SonarCloud.
      # Runs only if Begin step ran (gated on SONAR_TOKEN being set so
      # contributor fork-PRs without the secret don't fail the build).
      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
