name: CI

on:
  push:
    branches: [ main, 'claude/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Build and test via the test project — this transitively restores and builds
      # all src projects except AniRuntime.MauiClient (net10.0-android), which
      # requires the maui-android workload and Android SDK not available on ubuntu.
      # The .slnx includes MAUI for local development; CI targets test project only.
      - name: Restore
        run: dotnet restore tests/AniRuntime.Tests/AniRuntime.Tests.csproj

      - name: Build
        run: dotnet build tests/AniRuntime.Tests/AniRuntime.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          tests/AniRuntime.Tests/AniRuntime.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/**
          retention-days: 7
