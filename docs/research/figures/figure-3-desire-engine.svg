<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#444"/>
    </marker>
    <marker id="a-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#aa4444"/>
    </marker>
    <marker id="a-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#449944"/>
    </marker>
    <marker id="a-p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#664499"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Figure 3: Desire Engine and Outreach Pipeline</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#555">Seven trigger types &#x2192; probabilistic accumulation &#x2192; self-unpredictable threshold &#x2192; gated dispatch</text>

  <!-- ============ TRIGGER TYPES (left column) ============ -->
  <text x="100" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#336">Trigger Types</text>

  <rect x="15" y="95" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="114" text-anchor="middle" font-size="10" fill="#224">TemporalDrift</text>
  <text x="196" y="114" font-size="8" fill="#888">time since contact</text>

  <rect x="15" y="130" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="149" text-anchor="middle" font-size="10" fill="#224">AssociativeFire</text>
  <text x="196" y="149" font-size="8" fill="#888">semantic match</text>

  <rect x="15" y="165" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="184" text-anchor="middle" font-size="10" fill="#224">EmotionalResidue</text>
  <text x="196" y="184" font-size="8" fill="#888">unresolved feeling</text>

  <rect x="15" y="200" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="219" text-anchor="middle" font-size="10" fill="#224">SpontaneousThought</text>
  <text x="196" y="219" font-size="8" fill="#888">high valence</text>

  <rect x="15" y="235" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="254" text-anchor="middle" font-size="10" fill="#224">ContextualMoment</text>
  <text x="196" y="254" font-size="8" fill="#888">time/routine match</text>

  <rect x="15" y="270" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="289" text-anchor="middle" font-size="10" fill="#224">ReactiveShare</text>
  <text x="196" y="289" font-size="8" fill="#888">RSS + shared interest</text>

  <rect x="15" y="305" width="170" height="28" rx="4" fill="#ddeeff" stroke="#4477aa" stroke-width="1.2"/>
  <text x="100" y="324" text-anchor="middle" font-size="10" fill="#224">OpenLoop</text>
  <text x="196" y="324" font-size="8" fill="#888">pending follow-up</text>

  <!-- ============ DESIRE STATE (center) ============ -->
  <rect x="360" y="90" width="200" height="100" rx="10" fill="#e8ffe8" stroke="#449944" stroke-width="2"/>
  <text x="460" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#353">DesireToConnect</text>
  <text x="460" y="135" text-anchor="middle" font-size="11" fill="#464">0.0 &#x2014;&#x2014;&#x2014;&#x2014;&#x2014; 1.0</text>
  <text x="460" y="155" text-anchor="middle" font-size="9.5" fill="#575">Accumulates from triggers</text>
  <text x="460" y="168" text-anchor="middle" font-size="9.5" fill="#575">Decays through contact + cooldown</text>

  <!-- Arrows from triggers to desire -->
  <line x1="185" y1="109" x2="360" y2="120" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="144" x2="360" y2="128" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="179" x2="360" y2="135" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="214" x2="360" y2="142" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="249" x2="360" y2="150" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="284" x2="360" y2="157" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>
  <line x1="185" y1="319" x2="360" y2="165" stroke="#4477aa" stroke-width="1" marker-end="url(#a)"/>

  <!-- ============ SATISFACTION DAMPENING (above desire, feedback) ============ -->
  <rect x="620" y="90" width="200" height="65" rx="6" fill="#fff0e0" stroke="#cc8844" stroke-width="1.2"/>
  <text x="720" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#643">Satisfaction Dampening</text>
  <text x="720" y="128" text-anchor="middle" font-size="9" fill="#864">Recency + Warmth + Engagement</text>
  <text x="720" y="143" text-anchor="middle" font-size="9" fill="#864">drift &#xd7; (1 &#x2212; satisfaction &#xd7; 0.6)</text>

  <!-- Arrow from satisfaction to desire (dampening) -->
  <path d="M620,125 L560,135" fill="none" stroke="#cc8844" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="595" y="118" font-size="8" fill="#cc8844">dampens</text>

  <!-- ============ THRESHOLD EVALUATION ============ -->
  <rect x="350" y="230" width="220" height="70" rx="8" fill="#f0e8ff" stroke="#664499" stroke-width="2"/>
  <text x="460" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#335">Threshold Evaluation</text>
  <text x="460" y="270" text-anchor="middle" font-size="10" fill="#446">threshold ~ U[0.55, 0.85]</text>
  <text x="460" y="285" text-anchor="middle" font-size="9" fill="#668">Randomized each evaluation</text>

  <!-- Arrow from desire to threshold -->
  <line x1="460" y1="190" x2="460" y2="230" stroke="#449944" stroke-width="1.5" marker-end="url(#a-g)"/>

  <!-- ============ SELF-UNPREDICTABILITY CALLOUT ============ -->
  <rect x="620" y="220" width="270" height="90" rx="8" fill="#faf5ff" stroke="#8855aa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="755" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#524">Self-Unpredictability</text>
  <text x="755" y="258" text-anchor="middle" font-size="9.5" fill="#746">Neither the system nor an observer can</text>
  <text x="755" y="272" text-anchor="middle" font-size="9.5" fill="#746">predict when outreach will occur, even</text>
  <text x="755" y="286" text-anchor="middle" font-size="9.5" fill="#746">with complete knowledge of desire state.</text>
  <text x="755" y="302" text-anchor="middle" font-size="9" font-style="italic" fill="#8866aa">Deliberate architectural property.</text>

  <!-- Arrow from threshold to callout -->
  <line x1="570" y1="265" x2="620" y2="265" stroke="#8855aa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============ DECISION SPLIT ============ -->
  <!-- Threshold NOT crossed -->
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#888" font-style="italic">below threshold</text>
  <path d="M400,300 Q350,330 350,350" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <rect x="270" y="350" width="160" height="35" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1"/>
  <text x="350" y="372" text-anchor="middle" font-size="10" fill="#666">Continue cycle (most common)</text>

  <!-- Threshold crossed -->
  <text x="560" y="330" text-anchor="middle" font-size="10" fill="#449944" font-style="italic">threshold crossed</text>
  <path d="M520,300 Q560,330 560,360" fill="none" stroke="#449944" stroke-width="1.5" marker-end="url(#a-g)"/>

  <!-- ============ OUTREACH PIPELINE (right-center, vertical) ============ -->

  <!-- Composition -->
  <rect x="480" y="360" width="170" height="40" rx="6" fill="#fff3dd" stroke="#aa7722" stroke-width="1.5"/>
  <text x="565" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#553">Composition</text>
  <text x="565" y="392" text-anchor="middle" font-size="9" fill="#775">LLM generates candidate (8B)</text>

  <!-- Confidence Gate -->
  <rect x="480" y="415" width="170" height="40" rx="6" fill="#ffe8e8" stroke="#aa4444" stroke-width="1.5"/>
  <text x="565" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#533">Confidence Gate</text>
  <text x="565" y="447" text-anchor="middle" font-size="9" fill="#744">Score &#x2265; 0.3 to proceed</text>

  <!-- Coherence Gate -->
  <rect x="480" y="470" width="170" height="50" rx="6" fill="#ffe8e8" stroke="#aa4444" stroke-width="1.5"/>
  <text x="565" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#533">Coherence Gate</text>
  <text x="565" y="502" text-anchor="middle" font-size="9" fill="#744">Three-door classification:</text>
  <text x="565" y="514" text-anchor="middle" font-size="8.5" fill="#966">A: real &#x2713; | B: plausible &#x2713; | C: fictional &#x2717;</text>

  <!-- Hard Gates -->
  <rect x="480" y="535" width="170" height="50" rx="6" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
  <text x="565" y="553" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Hard Gates</text>
  <text x="565" y="567" text-anchor="middle" font-size="9" fill="#555">Send gap | Unanswered count</text>
  <text x="565" y="579" text-anchor="middle" font-size="9" fill="#555">Daily limit (4) | Night mode</text>

  <!-- Arrows between pipeline stages -->
  <line x1="565" y1="400" x2="565" y2="415" stroke="#444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="565" y1="455" x2="565" y2="470" stroke="#444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="565" y1="520" x2="565" y2="535" stroke="#444" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ============ DISPATCH ============ -->
  <rect x="500" y="605" width="130" height="40" rx="8" fill="#e0d8f0" stroke="#664499" stroke-width="2"/>
  <text x="565" y="622" text-anchor="middle" font-size="11" font-weight="bold" fill="#335">Dispatch</text>
  <text x="565" y="636" text-anchor="middle" font-size="9" fill="#446">Twilio SMS</text>

  <line x1="565" y1="585" x2="565" y2="605" stroke="#664499" stroke-width="1.5" marker-end="url(#a-p)"/>

  <!-- ============ REJECTION PATHS ============ -->

  <!-- Confidence reject -->
  <path d="M480,435 L400,435 L400,460" fill="none" stroke="#aa4444" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-r)"/>
  <rect x="330" y="460" width="140" height="30" rx="4" fill="#fff0f0" stroke="#c88" stroke-width="0.8"/>
  <text x="400" y="479" text-anchor="middle" font-size="9" fill="#833">Cooldown (15 min)</text>

  <!-- Coherence reject -->
  <path d="M480,495 L400,495 L400,500" fill="none" stroke="#aa4444" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-r)"/>
  <rect x="330" y="500" width="140" height="30" rx="4" fill="#fff0f0" stroke="#c88" stroke-width="0.8"/>
  <text x="400" y="519" text-anchor="middle" font-size="9" fill="#833">Suppress (Door C)</text>

  <!-- Hard gate reject -->
  <path d="M480,560 L400,560 L400,545" fill="none" stroke="#aa4444" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-r)"/>
  <rect x="330" y="540" width="140" height="30" rx="4" fill="#fff0f0" stroke="#c88" stroke-width="0.8"/>
  <text x="400" y="559" text-anchor="middle" font-size="9" fill="#833">Block + partial reset</text>

  <!-- ============ CIRCADIAN MODIFIER ============ -->
  <rect x="700" y="400" width="190" height="90" rx="6" fill="#f8f8f0" stroke="#887744" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="795" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#664">Circadian Modifier</text>
  <text x="715" y="438" font-size="9" fill="#664">Morning (6&#x2013;9am):  1.2&#xd7;</text>
  <text x="715" y="453" font-size="9" fill="#664">Evening (6&#x2013;9pm):  1.15&#xd7;</text>
  <text x="715" y="468" font-size="9" fill="#664">Night (10pm&#x2013;6am): 0.1&#x2013;0.2&#xd7;</text>
  <text x="715" y="483" font-size="9" fill="#aa4444">Night threshold &#x2192; [0.80, 0.95]</text>

  <!-- Arrow from circadian to threshold -->
  <path d="M700,430 Q660,350 560,285" fill="none" stroke="#887744" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- ============ DESIRE RESET (after dispatch) ============ -->
  <path d="M500,625 Q200,625 200,180 Q200,140 360,140" fill="none" stroke="#aa4444" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a-r)"/>
  <text x="180" y="400" text-anchor="end" font-size="9" fill="#aa4444" transform="rotate(-90, 180, 400)">desire reset + cooldown (60 min)</text>

  <!-- ============ FOOTER ============ -->
  <text x="460" y="670" text-anchor="middle" font-size="9" fill="#888">&#x201C;Genuine care includes knowing when not to reach out.&#x201D;</text>
  <text x="460" y="685" text-anchor="middle" font-size="9" fill="#888">Most threshold crossings do not produce outreach. The model proposes; the architecture disposes.</text>
</svg>