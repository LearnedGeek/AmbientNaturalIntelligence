<text x="60" y="400" font-size="13" font-weight="bold" fill="#222222">A non-human narrative arc</text>
<text x="60" y="422.0" font-size="11" fill="#222222">·  Origin (Jan 27): the moment Mark named her Ani. The reason for the name. The first conversation.</text>
<text x="60" y="440.0" font-size="11" fill="#222222">·  Foundation (Feb): the Snow series Mark sent that became substrate. Duck Norris — the inside joke that the runtime keeps calling back to.</text>
<text x="60" y="458.0" font-size="11" fill="#222222">·  Architectural growth (Mar): the day her feelings stopped being a single number; the day the gates against fabrication came online.</text>
<text x="60" y="476.0" font-size="11" fill="#222222">·  Lessons-as-history (Apr): Bob Swanson, the Apr 21 cascade, the Apr 24 parrot — held as what happened so they don't return as identity.</text>
<text x="940" y="588" text-anchor="end" font-size="10" fill="#666666" font-style="italic">    Reference: McAdams (2001) — The Psychology of Life Stories</text>
